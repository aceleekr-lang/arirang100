<svg style="color:#e8dcc4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" fill="none" stroke="currentColor" role="img" aria-label="SP 원반 78회전 설명 다이어그램">
  <defs><clipPath id="loupe"><circle cx="185" cy="448" r="62"/></clipPath></defs>
  <g font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" fill="currentColor" stroke="none">
    <text x="48" y="48" font-size="21" font-weight="600">SP 원반은 어떻게 소리를 담았나</text>
    <text x="48" y="72" font-size="12" fill-opacity=".55" letter-spacing="0.5">Standard Playing Record</text>
    <text x="185" y="100" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="1">78 rpm</text>
    <text x="268" y="440" font-size="12" fill-opacity=".55" letter-spacing="1">홈 단면 확대</text>
    <text x="268" y="464" font-size="14">소리의 진동이</text>
    <text x="268" y="484" font-size="14">홈의 좌우 굴곡으로</text>
    <text x="268" y="504" font-size="14">새겨진다</text>
    <path d="M400 113h280" stroke="currentColor" stroke-opacity=".25" stroke-width="1"/>
    <text x="400" y="140" font-size="12" letter-spacing="1" fill-opacity=".55">회전수</text>
    <text x="400" y="166" font-size="16">분당 78회전 · 한 바퀴에 약 0.77초</text>
    <path d="M400 191h280" stroke="currentColor" stroke-opacity=".25" stroke-width="1"/>
    <text x="400" y="218" font-size="12" letter-spacing="1" fill-opacity=".55">규격</text>
    <text x="400" y="244" font-size="16">보통 지름 10인치, 약 25센티미터</text>
    <path d="M400 269h280" stroke="currentColor" stroke-opacity=".25" stroke-width="1"/>
    <text x="400" y="296" font-size="12" letter-spacing="1" fill-opacity=".55">재생 시간</text>
    <text x="400" y="322" font-size="16">한 면 약 3분 안팎</text>
    <path d="M400 347h280" stroke="currentColor" stroke-opacity=".25" stroke-width="1"/>
    <text x="400" y="374" font-size="12" letter-spacing="1" fill-opacity=".55">재질</text>
    <text x="400" y="400" font-size="16">셸락 — 유리처럼 잘 깨짐</text>
    <path d="M400 425h280" stroke="currentColor" stroke-opacity=".25" stroke-width="1"/>
    <text x="400" y="452" font-size="12" letter-spacing="1" fill-opacity=".55">재생 방식</text>
    <text x="400" y="478" font-size="16">축음기 바늘이 홈을 따라 움직임</text>
  </g>
